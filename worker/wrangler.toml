name = "zerorate"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
crons = ["1,6,16 * * * *", "31 */3 * * *", "41 4-9 * * 1-5", "46 */3 * * *"]  # 환율 · FRED·ECOS·KRX · KRX 금 종가 공개 시각(평일 한국 13:41~18:41) · S&P500·코스피 다듬기+자료 검사

[[kv_namespaces]]
binding = "DATA"
id = "KV_ID"   # 배포할 때 자동으로 채움
