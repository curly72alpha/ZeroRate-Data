# 임시: CBOE 자료 주소 확인용 (확인 후 지움)
name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://cdn-api.cboe.com/api/global/delayed_quotes/quotes/_VIX.json \
                   https://cdn.cboe.com/api/global/delayed_quotes/charts/intraday/_VIX.json \
                   https://cdn-api.cboe.com/api/global/delayed_quotes/charts/intraday/_VIX.json; do
            echo "== $u"
            curl -s -m 20 -A "Mozilla/5.0" -w "\nHTTP %{http_code}\n" "$u" -o /tmp/r.json; tail -c 0 /tmp/r.json
            jq -c 'if .data|type=="object" then (.data|with_entries(select(.value|type!="array" and type!="object"))) else (.data|length) end' /tmp/r.json 2>/dev/null | head -c 1500
            jq -c '.data[0:3], .data[-2:]' /tmp/r.json 2>/dev/null | head -c 800
            echo
          done
