name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.ECOS_API_KEY }}
        run: |
          curl -s "https://ecos.bok.or.kr/api/StatisticItemList/$K/json/kr/1/400/901Y027" | jq -r '.StatisticItemList.row[]? | select(.ITEM_NAME|test("실업|고용률")) | "\(.ITEM_CODE) \(.ITEM_NAME) \(.CYCLE) \(.END_TIME)"'
          echo "== gdp"; curl -s "https://ecos.bok.or.kr/api/StatisticSearch/$K/json/kr/1/100/200Y102/Q/2025Q1/2026Q4/10211" | jq -c '.StatisticSearch.row[]? | [.TIME,.DATA_VALUE]'
