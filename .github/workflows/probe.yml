name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          u=https://zerorate.curly72alpha.workers.dev
          curl -s -w "\nquote %{http_code}\n" $u/vix/quote.json | head -c 400; echo
          curl -s -w "\nexim %{http_code}\n" $u/exim.json | head -c 200; echo
          curl -s -o q.json -w "cboe quote from runner %{http_code}\n" https://cdn-api.cboe.com/api/global/delayed_quotes/quotes/_VIX.json; jq -c '.data | {current_price, open, high, low, last_trade_time}' q.json
