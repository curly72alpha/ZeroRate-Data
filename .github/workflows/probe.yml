name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://zerorate.curly72alpha.workers.dev/fred/KOSPI.json -o k.json
          jq -r '.observations[:260] | (max_by(.value|tonumber) | "max \(.date) \(.value)"), (.[0] | "last \(.date) \(.value)")' k.json
          jq -r '[.observations[] | select(.date >= "2025-10-01")] | reverse | .[0:300:10] | map("\(.date) \(.value)") | join(" | ")' k.json
