name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          curl -sL -A "$UA" -o b.html "https://www.bok.or.kr/portal/singl/crncyPolicyDrcMtg/listYear.do?mtgSe=A&menuNo=200755&pYear=2027"
          grep -n '[0-9]\{1,2\}월 *[0-9]\{1,2\}일\|[0-9]\{4\}\.[0-9]\{2\}\.[0-9]\{2\}\|[0-9]\{1,2\}\.[0-9]\{1,2\}\.(' b.html | head -40
          echo ====
          n=$(grep -n '[0-9]\{1,2\}월 *[0-9]\{1,2\}일' b.html | head -1 | cut -d: -f1); sed -n "$((n-15)),$((n+25))p" b.html
