# 예전 앱(지인 폰, GitHub 주소만 읽음)을 위한 사본 만들기.
# 자료는 모두 Cloudflare Worker가 받고(키도 Worker에만), 여기서는 Worker 것을 복사만 함 — API를 직접 부르지 않음(11-18).
# GitHub 예약은 몇 시간씩 빠질 수 있어 지인 앱은 조금 늦을 수 있음. 이 작업을 멈추면 지인 앱만 자료가 끊김.
name: update
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Worker 자료 복사
        run: |
          W=https://zerorate.curly72alpha.workers.dev
          mkdir -p out/historical out/fred out/ecos out/krx
          get() { curl -sf "$W/$1" -o "out/$1.new" && jq -e . "out/$1.new" >/dev/null && mv "out/$1.new" "out/$1" || rm -f "out/$1.new"; }
          get latest.json
          for d in 29 30 31; do get "historical/$(date -u -d "-$d day" +%F).json"; done
          for id in UNRATE DGS2 DFEDTARU DFEDTARL T10Y2Y SP500 NASDAQQGLDI DEXKOUS A191RL1Q225SBEA DTWEXBGS WALCL VIXCLS CPIAUCSL_pc1; do get "fred/$id.json"; done
          for f in base y3 y10 cpi base_m deposit; do get "ecos/$f.json"; done
          get krx/gold.json
          ls -R out | head -50

      - name: 올리기
        run: |
          [ -s out/latest.json ] || { echo "Worker 자료 없음"; exit 1; }
          cd out
          git init -q -b data
          git config user.name "zerorate-bot"
          git config user.email "zerorate-bot@users.noreply.github.com"
          git add -A
          git commit -qm "copy $(date -u +%FT%TZ)"
          # 기록을 쌓지 않고 한 커밋만 유지
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
