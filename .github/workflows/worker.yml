# Cloudflare Worker(worker/) 배포. Secret: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, OXR_APP_ID
name: worker
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: KV 저장소 (없으면 만듦)
        run: |
          set -e
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(curl -sf -H "$auth" "$api?per_page=100" | jq -r '.result[] | select(.title=="zerorate-data") | .id' | head -1)
          [ -n "$id" ] || id=$(curl -sf -X POST -H "$auth" -H "Content-Type: application/json" -d '{"title":"zerorate-data"}' "$api" | jq -r .result.id)
          [ -n "$id" ] && [ "$id" != "null" ]
          sed -i "s/KV_ID/$id/" worker/wrangler.toml
      - name: workers.dev 주소 (없으면 만듦)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          sub=$(curl -s -H "$auth" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            curl -s -X PUT -H "$auth" -H "Content-Type: application/json" -d '{"subdomain":"zerorate-curly72"}' "$api" | jq -c '{success, errors}'
          fi
          echo "주소 앞부분: $(curl -s -H "$auth" "$api" | jq -r .result.subdomain)"
      - name: 배포
        working-directory: worker
        run: npx -y wrangler@4 deploy
      - name: 키 넣기
        working-directory: worker
        run: |
          printf '%s' "${{ secrets.OXR_APP_ID }}" | npx -y wrangler@4 secret put OXR_APP_ID
          printf '%s' "${{ secrets.FRED_API_KEY }}" | npx -y wrangler@4 secret put FRED_API_KEY
          printf '%s' "${{ secrets.ECOS_API_KEY }}" | npx -y wrangler@4 secret put ECOS_API_KEY
          printf '%s' "${{ secrets.DATA_GO_KR_KEY }}" | npx -y wrangler@4 secret put DATA_GO_KR_KEY
      - name: 일정 새로 받게 (배포한 코드로)
        working-directory: worker
        run: |
          npx -y wrangler@4 kv key delete events.json --binding DATA --remote || true
          npx -y wrangler@4 kv key delete slow:at --binding DATA --remote || true   # 다음 요청 때 FRED·CBOE를 새 코드로 다시 받게
      - name: 확인
        run: |
          sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
          url="https://zerorate.$sub.workers.dev"
          echo "주소: $url"
          sleep 5
          curl -sf "$url/latest.json" | jq -r '"환율 시각 \(.timestamp | strftime("%F %H:%M UTC"))"'
          curl -sf "$url/historical/$(date -u -d '-30 day' +%F).json" | jq -r '"30일 전 \(.timestamp | strftime("%F"))"'
          curl -sf "$url/fred/UNRATE.json" > /dev/null   # 낡았으면 Worker가 뒤에서 FRED·ECOS를 받기 시작
          sleep 40
          curl -sf "$url/fred/UNRATE.json" | jq -r '"FRED 실업률 \(.observations[0].date)"'
          curl -sf "$url/fred/DFII10.json" | jq -r '"FRED 실질금리 \(.observations[0].date) \(.observations[0].value)"' || true
          curl -sf "$url/fred/SP500.json" | jq -r '"S&P500 \(.source // "FRED") \(.observations | length)개 \(.observations[0].date)~\(.observations[-1].date)"' || true
          curl -sf "$url/fred/VIXCLS.json" | jq -r '"FRED VIX \(.observations[0].date) (\(.observations | length)개)"'
          curl -sf "$url/ecos/deposit.json" | jq -r '"ECOS 정기예금 \(.StatisticSearch.row[-1].TIME) \(.StatisticSearch.row[-1].DATA_VALUE)%"'
          curl -sf "$url/ecos/base_m.json" | jq -r '"ECOS 기준금리 \(.StatisticSearch.row[-1].TIME) \(.StatisticSearch.row[-1].DATA_VALUE)%"'
          curl -s "$url/events.json" | jq -c . || true
          curl -sf "$url/krx/gold.json" | jq -r '"KRX 금 \(.response.body.totalCount)개, 받은 것 \(.response.body.items.item | length)개"'
